<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 图种仓库 · 自动扫描下载</title>
    <style>
        /* ---------- 与之前相同，简洁起见只保留核心样式 ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(145deg, #0b1120, #1a2639);
            min-height: 100vh;
            padding: 40px 20px;
            color: #e8edf5;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 20px; margin-bottom: 40px;
            padding-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.08);
        }
        .header h1 {
            font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(135deg, #f0c27f, #fc5c7d);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header h1 small { font-size: 1rem; -webkit-text-fill-color: #8892b0; margin-left: 12px; }
        .toolbar {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .toolbar button {
            padding: 10px 24px; border: none; border-radius: 60px;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            transition: all 0.2s; background: #2d3748; color: #cbd5e1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 8px;
        }
        .toolbar button:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #6366f1; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #22c55e; }
        .badge { background: #1e293b; padding: 6px 16px; border-radius: 40px; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        #progressWrap {
            margin-bottom: 30px; background: #1e293b; border-radius: 60px;
            height: 8px; overflow: hidden; opacity: 0; transition: opacity 0.3s;
        }
        #progressWrap.active { opacity: 1; }
        #progressBar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
            border-radius: 60px; transition: width 0.25s ease;
        }
        #statusText {
            text-align: center; font-size: 0.95rem; color: #94a3b8;
            min-height: 28px; margin-bottom: 20px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }
        .card {
            background: #1e293b; border-radius: 20px; padding: 20px 16px 16px;
            border: 1px solid #334155; transition: all 0.25s ease;
            display: flex; flex-direction: column; align-items: center;
            text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .card:hover { transform: translateY(-6px); border-color: #4f46e5; box-shadow: 0 16px 40px rgba(79,70,229,0.25); }
        .card .checkbox-wrap { align-self: flex-start; margin-bottom: 8px; }
        .card input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4f46e5; cursor: pointer; }
        .file-icon { font-size: 4rem; line-height: 1; margin: 6px 0 4px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .card .file-name { font-weight: 600; font-size: 1rem; word-break: break-all; margin: 8px 0 4px; color: #f1f5f9; }
        .card .file-meta { font-size: 0.75rem; color: #64748b; background: #0f172a; padding: 2px 12px; border-radius: 40px; margin-bottom: 12px; }
        .card .dl-single {
            background: #334155; border: none; color: white;
            padding: 8px 16px; border-radius: 40px; font-weight: 500;
            font-size: 0.85rem; cursor: pointer; transition: 0.2s;
            width: 100%; margin-top: auto;
        }
        .card .dl-single:hover { background: #4f46e5; }
        .alert {
            background: #451a1a; border-left: 6px solid #f87171;
            padding: 14px 20px; border-radius: 12px;
            margin: 30px 0 10px; color: #fca5a5; font-size: 0.95rem;
            display: flex; align-items: center; gap: 12px;
        }
        .alert strong { color: #fecaca; }
        .loading-spinner {
            text-align: center; padding: 60px 0; font-size: 1.4rem; color: #94a3b8;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .toolbar button { padding: 8px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>🧩 图种仓库 <small>· 自动扫描 files/</small></h1>
        <div class="toolbar">
            <span class="badge">📁 <span id="totalCount">0</span> 个文件</span>
            <button id="selectAllBtn" class="btn-primary">✅ 全选</button>
            <button id="deselectAllBtn">⬜ 取消全选</button>
            <button id="batchDownloadBtn" class="btn-success">⬇️ 批量下载选中</button>
        </div>
    </div>

    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="statusText">⏳ 正在从 GitHub 扫描 files/ 目录...</div>

    <div class="grid" id="fileGrid"></div>

    <div class="alert">
        <span style="font-size:2rem;">⚠️</span>
        <div>
            <strong>图种保护机制已开启：</strong> 所有下载链接均强制使用 <code>download</code> 属性，
            浏览器<strong>不会</strong>渲染预览图片，原始二进制数据（含附加压缩包）将完好无损地保存。
            <span style="display:block; margin-top:4px; color:#fbbf24;">批量下载时若浏览器提示“允许下载多个文件”，请点击“允许”即可。</span>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  ✏️ 配置你的 GitHub 仓库信息（公开仓库）
    // ============================================================
    const REPO_OWNER = '你的GitHub用户名';   // 例如 'zhangsan'
    const REPO_NAME   = '你的仓库名';        // 例如 'zhangsan.github.io' 或 'my-repo'
    const FOLDER_PATH = 'files';             // 存放图种的文件夹名

    // ============================================================
    //  核心逻辑
    // ============================================================
    const grid = document.getElementById('fileGrid');
    const totalSpan = document.getElementById('totalCount');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    let fileList = [];          // 存储 { name, size, download_url }
    let isDownloading = false;

    // 格式化文件大小
    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    // 从 GitHub API 获取文件列表
    async function fetchFileList() {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}`;
        try {
            const resp = await fetch(url);
            if (!resp.ok) {
                if (resp.status === 404) {
                    throw new Error(`文件夹 "${FOLDER_PATH}" 不存在，请检查仓库和路径。`);
                } else if (resp.status === 403) {
                    throw new Error(`API 速率限制，请稍后重试。`);
                } else {
                    throw new Error(`获取失败 (HTTP ${resp.status})`);
                }
            }
            const data = await resp.json();
            // 只保留文件（忽略子目录），并过滤掉非图片？不过图种可能是任意扩展名，保留全部文件
            const files = data.filter(item => item.type === 'file');
            return files.map(item => ({
                name: item.name,
                size: item.size,
                download_url: item.download_url  // 这是 GitHub 的原始文件链接，可以直接下载
            }));
        } catch (err) {
            throw err;
        }
    }

    // 渲染卡片
    function renderCards(files) {
        grid.innerHTML = '';
        if (files.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">📭 该文件夹下没有文件</div>`;
            return;
        }
        files.forEach((file, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            const ext = file.name.split('.').pop().toLowerCase();
            let icon = '📄';
            if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)) icon = '🌅';
            else if (['zip','rar','7z'].includes(ext)) icon = '📦';
            else if (['txt','md','log'].includes(ext)) icon = '📄';
            else if (['exe','msi','appimage'].includes(ext)) icon = '⚙️';
            else if (['mp3','wav','flac'].includes(ext)) icon = '🎵';
            else if (['mp4','mkv','avi'].includes(ext)) icon = '🎬';

            card.innerHTML = `
                <div class="checkbox-wrap">
                    <input type="checkbox" class="file-checkbox" data-index="${index}" data-name="${file.name}">
                </div>
                <div class="file-icon">${icon}</div>
                <div class="file-name" title="${file.name}">${file.name}</div>
                <div class="file-meta">${formatSize(file.size)}</div>
                <button class="dl-single" data-name="${file.name}" data-url="${file.download_url}">⬇ 单独下载</button>
            `;
            grid.appendChild(card);
        });
        totalSpan.textContent = files.length;
        // 绑定事件代理
        grid.addEventListener('click', handleCardClick);
    }

    // 事件处理
    function handleCardClick(e) {
        const target = e.target;
        if (target.classList.contains('dl-single')) {
            e.preventDefault();
            const name = target.dataset.name;
            const url = target.dataset.url;
            triggerDownload(name, url);
        }
    }

    // 触发单个文件下载（使用 GitHub 原始链接）
    function triggerDownload(fileName, fileUrl) {
        // 直接使用 GitHub 提供的 download_url（这是原始文件链接，带有 CORS 支持）
        // 但我们仍使用 a 标签强制下载，避免浏览器打开
        const a = document.createElement('a');
        a.href = fileUrl;
        a.download = fileName;  // 强制下载
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        statusText.textContent = `⬇️ 正在下载：${fileName}`;
        setTimeout(() => {
            if (!isDownloading) statusText.textContent = '💡 就绪，勾选文件即可批量下载';
        }, 2000);
    }

    // 获取所有选中的文件信息
    function getCheckedFiles() {
        const checks = document.querySelectorAll('.file-checkbox:checked');
        const indices = Array.from(checks).map(cb => parseInt(cb.dataset.index));
        return indices.map(i => fileList[i]);
    }

    // 批量下载
    async function batchDownload() {
        if (isDownloading) return;
        const selected = getCheckedFiles();
        if (selected.length === 0) {
            statusText.textContent = '⚠️ 请先勾选至少一个文件！';
            return;
        }

        isDownloading = true;
        const total = selected.length;
        progressWrap.classList.add('active');
        progressBar.style.width = '0%';
        statusText.textContent = `⏳ 准备批量下载 ${total} 个文件...`;

        for (let i = 0; i < total; i++) {
            const file = selected[i];
            const percent = ((i + 1) / total) * 100;
            progressBar.style.width = `${percent}%`;
            statusText.textContent = `📥 正在触发第 ${i+1}/${total} 个：${file.name}`;
            triggerDownload(file.name, file.download_url);
            await new Promise(resolve => setTimeout(resolve, 500));
        }

        progressBar.style.width = '100%';
        statusText.textContent = `✅ 全部 ${total} 个文件下载已触发完毕！`;
        setTimeout(() => {
            progressWrap.classList.remove('active');
            progressBar.style.width = '0%';
            if (!document.querySelector('.file-checkbox:checked')) {
                statusText.textContent = '💡 就绪，勾选文件即可批量下载';
            }
        }, 3000);
        isDownloading = false;
    }

    // UI 按钮绑定
    document.getElementById('selectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = true);
        statusText.textContent = '✅ 已全选所有文件';
    });
    document.getElementById('deselectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = false);
        statusText.textContent = '⬜ 已取消全部勾选';
    });
    document.getElementById('batchDownloadBtn').addEventListener('click', batchDownload);

    // 勾选变化更新状态
    document.addEventListener('change', (e) => {
        if (e.target.classList.contains('file-checkbox')) {
            const checked = document.querySelectorAll('.file-checkbox:checked').length;
            if (checked > 0) {
                statusText.textContent = `📌 已选中 ${checked} 个文件，点击“批量下载选中”即可`;
            } else {
                statusText.textContent = '💡 勾选文件后点击“批量下载选中”';
            }
        }
    });

    // ============ 启动 ============
    (async function init() {
        try {
            statusText.textContent = '⏳ 正在从 GitHub 扫描 files/ 目录...';
            fileList = await fetchFileList();
            renderCards(fileList);
            statusText.textContent = `✅ 扫描完成，共 ${fileList.length} 个文件。勾选后批量下载。`;
        } catch (err) {
            statusText.textContent = `❌ 扫描失败：${err.message}`;
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#f87171;">
                ⚠️ 无法获取文件列表，请检查仓库信息或网络。<br>
                <span style="font-size:0.9rem; color:#94a3b8;">${err.message}</span>
            </div>`;
        }
    })();
</script>
</body>
</html>
